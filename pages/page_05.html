<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Page 05 - 05. EU UAS Certification Overview</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #0b100d;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .slide-canvas {
      width: 1920px;
      height: 1080px;
      position: relative;
      background: #0b100d;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-sizing: border-box;
      border: 1px solid rgba(109, 142, 118, 0.25);
    }
    .slide-img-wrapper {
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #000000;
    }
    .slide-img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
  </style>
</head>
<body>
  <div class="slide-canvas">
    <div class="corner-tr"></div>
    <div class="corner-bl"></div>
    <div class="slide-img-wrapper">
      <img src="../assets/src_page_05.png" alt="Page 05 - 05. EU UAS Certification Overview" class="slide-img">
    </div>
  </div>
</body>
</html>
